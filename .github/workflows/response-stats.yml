name: Update response stats

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect issue data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state all --limit 500 \
            --json number,createdAt,closedAt,state,author,comments > "$RUNNER_TEMP/issues.json"

      - name: Update README
        run: python3 .github/scripts/update_response_stats.py "$RUNNER_TEMP/issues.json" README.md

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "Statistics are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update issue response statistics' README.md
          git push
